[package]
name = "iconarium-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Read-side catalog over the Iconarium index: multi-library search, tags, library metadata (iconarium.yaml), previews and export. Shared by iconarium-cli and its MCP server."

[features]
default = []
# JSON Schema derives on the DTOs (needed by the MCP server's tool schemas).
schema = ["dep:schemars"]
# Helpers that build a small on-disk library + index for tests in dependent crates.
fixtures = []

[dependencies]
svg-core = { path = "../svg-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
schemars = { version = "1", optional = true }
# Pure-Rust YAML (no unsafe libyaml); serde_yaml is archived. Pinned: bump deliberately.
serde-saphyr = "=1.3.0"

[dev-dependencies]
tempfile = "3"
# Integration tests use the fixtures module.
iconarium-catalog = { path = ".", features = ["fixtures"] }
