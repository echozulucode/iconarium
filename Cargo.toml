[workspace]
resolver = "2"
members = ["crates/svg-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Eric Zimmerman"]
repository = "https://github.com/echozulucode/iconarium"
homepage = "https://github.com/echozulucode/iconarium"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
blake3 = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "debuginfo"
