# Issue log — bugs, blockers and their resolutions. Resolved issues feed docs/lessons.yaml.
issues:
  - id: 1
    date: 2026-10-07
    title: "Deeply nested groups crash the process (stack overflow)"
    status: resolved
    description: |
      5,000 nested <g> overflowed roxmltree's recursion on a 2 MiB thread; 600–1,020 levels
      overflowed usvg's tree builder in release builds. A stack overflow cannot be caught, so
      one such file in a library would kill the app. Found by dataset E.
    attempts:
      - date: 2026-10-07
        action: "Raw-markup depth pre-scan (element_depth) before parsing; Limits.max_nesting_depth = 256; HARD_MAX_DEPTH = 1024 for crop/normalize; 16 MiB preview worker stacks"
        outcome: "LimitExceeded on 2 MiB threads up to 100,000 levels, in debug and release"
    resolution: "Depth limit enforced before any recursive parser runs; regression tests in tests/pathological.rs"
    lesson: "Guard recursion depth on raw input before handing it to recursive parsers; catch_unwind does not cover stack overflow."

  - id: 2
    date: 2026-10-07
    title: "Large <text> makes rendering unbounded (minutes / GBs)"
    status: resolved
    description: |
      A 200 KB <text> run took 14.6 s; 5 MB of text took 33 s and 2.7 GB, or ran out of memory.
      analyze() reported these files as Ready, so the app would try to thumbnail them.
    attempts:
      - date: 2026-10-07
        action: "Count characters inside <text> elements; enforce per-run (10k) and total (200k) limits"
        outcome: "Rejected in 10–26 ms; text is still extracted (capped), so the file stays searchable"
    resolution: "Limits.max_render_text_chars + per-run cap in check_complexity"
    lesson: "Measure cost drivers, not just size: layout cost grows super-linearly with text even when the file is small."

  - id: 3
    date: 2026-10-07
    title: "Copy SVG on Windows put only a bitmap on the clipboard"
    status: resolved
    description: |
      clipboard-rs set() handles an Image by re-opening and emptying the clipboard, and closes it
      on return. The later image/svg+xml and PNG writes then failed silently. PowerPoint would only
      ever paste a raster. Found by the independent review.
    attempts:
      - date: 2026-10-07
        action: "Write all formats with clipboard-win in one open/empty/close cycle: image/svg+xml → PNG → CF_BITMAP → optional text"
        outcome: "Type-checks for the Windows target; needs Office validation (issue 16)"
    resolution: "native/clipboard.rs uses clipboard-win on Windows, clipboard-rs elsewhere"
    lesson: "Read the platform implementation of a cross-platform clipboard crate before trusting multi-format writes."

  - id: 4
    date: 2026-10-07
    title: "Thumbnailing followed <image href> to any path, including UNC shares"
    status: resolved
    description: "usvg's default resolver reads absolute paths, `..` escapes and \\\\host\\share paths. On Windows that can leak NTLM hashes during background prefill."
    attempts:
      - date: 2026-10-07
        action: "Custom ImageHrefResolver: data: URIs, plus relative raster files inside the SVG's folder (≤ 20 MB)"
        outcome: "Policy unit-tested"
    resolution: "svg::renderer::safe_href_resolver"
    lesson: "Renderer defaults are tuned for trusted input; a file browser renders untrusted files unattended."

  - id: 5
    date: 2026-10-07
    title: "Library switch mid-scan could mix two libraries in one catalog"
    status: resolved
    description: "open_library was not serialized. The cancel flag was set before the generation bump, so a final scan batch could land in the new library's catalog."
    attempts:
      - date: 2026-10-07
        action: "Serialize switches; bump the generation first; re-check it under the catalog write lock; tie scan and watcher to a generation"
        outcome: "E2E restart, watcher and library-switch scenarios pass"
    resolution: "app/library.rs generation discipline"
    lesson: "Invalidate (bump the generation) before cancelling, and re-check under the same lock that guards the swap."

  - id: 6
    date: 2026-10-07
    title: "Stale analysis could overwrite metadata of a file edited mid-analysis"
    status: resolved
    description: "The DB write matched on id only, so a file changed during analysis kept old dimensions and text across restarts."
    attempts:
      - date: 2026-10-07
        action: "Database::save_analyses_checked with AND fast_fingerprint = ?"
        outcome: "Regression test passes"
    resolution: "Fingerprint-checked persistence"
    lesson: "Async results need the version they were computed for, checked at write time."

  - id: 7
    date: 2026-10-07
    title: "Watcher rescanned forever on Linux"
    status: resolved
    description: "inotify access events from the scanner itself triggered full reconciles in a loop."
    attempts:
      - date: 2026-10-07
        action: "Ignore access events"
        outcome: "Found and fixed by the E2E run"
    resolution: "app/watch.rs filters EventKind::Access"
    lesson: "A watcher must ignore events its own reads cause."

  - id: 8
    date: 2026-10-07
    title: "Content search incomplete for minutes on large diagram libraries"
    status: resolved
    description: "Analysis of a file was tied to rendering its thumbnail. 10k diagrams took about 17 min on one worker before content search was complete."
    attempts:
      - date: 2026-10-07
        action: "P4 lane: analyse the whole library first, prefill thumbnails afterwards"
        outcome: "About 50 files/s analysed on 1 worker in E2E (about 3.5 min for 10k)"
    resolution: "preview/queue.rs P4 + worker deferral"
    lesson: "Order background work by what unblocks the user (searchability) rather than by file order."

  - id: 9
    date: 2026-10-07
    title: "Regex '^' anchors missed filenames in subfolders"
    status: resolved
    description: "The regex prefilter ran over joined fields where the filename is a suffix of the path line."
    attempts:
      - date: 2026-10-07
        action: "Skip the prefilter for '^'-anchored patterns"
        outcome: "re:^thermometer- finds 9 of 9"
    resolution: "search/ranking.rs"
    lesson: "Prefilters must be strictly conservative; test them with anchored patterns."

  - id: 10
    date: 2026-10-07
    title: "UI stuck on 'No folder' when the startup restore took longer than 3 s"
    status: resolved
    description: "get_app_state's bounded wait expired and the later 'load' event did not refresh the library info."
    attempts:
      - date: 2026-10-07
        action: "Refresh app state on catalog://changed with reason 'load'"
        outcome: "Fixed by the E2E agent"
    resolution: "src/app/App.tsx"
    lesson: "Any bounded wait needs an event-driven catch-up path."

