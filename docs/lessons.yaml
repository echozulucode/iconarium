# Lessons learned — append-only. Supersede with a new entry rather than editing.
lessons:
  - id: 1
    date: 2026-10-07
    source: "issue-1"
    category: security
    lesson: |
      Bound recursion depth on raw input before any recursive parser or renderer sees it.
      catch_unwind cannot recover from a stack overflow, so one hostile file can kill the process.
    applied: true

  - id: 2
    date: 2026-10-07
    source: "issue-2"
    category: architecture
    lesson: |
      Guardrails must measure cost drivers, not just file size. Text layout dominated render time
      and grew super-linearly. Over-limit files should stay listed and searchable.
    applied: true

  - id: 3
    date: 2026-10-07
    source: "issue-3"
    category: tooling
    lesson: |
      Verify how a cross-platform clipboard crate writes multiple formats on Windows. One API call
      can silently re-open and close the clipboard and drop every format after the first.
    applied: true

  - id: 4
    date: 2026-10-07
    source: "issue-4"
    category: security
    lesson: |
      Library defaults assume trusted input. An app that renders arbitrary user files in the
      background must restrict external resource loading: absolute paths, `..` escapes and UNC.
    applied: true

  - id: 5
    date: 2026-10-07
    source: "issue-5"
    category: async
    lesson: |
      When switching shared state, bump the generation before cancelling workers. Re-check it under
      the same lock that guards the swap, and serialize the switch itself.
    applied: true

  - id: 6
    date: 2026-10-07
    source: "issue-6"
    category: async
    lesson: |
      Results of background work must carry the input version (fingerprint) they were computed for,
      and the write must be conditional on that version still being current.
    applied: true

  - id: 7
    date: 2026-10-07
    source: "issue-7"
    category: architecture
    lesson: "File watchers must ignore events caused by the app's own reads (access events), or they feed back into rescans."
    applied: true

  - id: 8
    date: 2026-10-07
    source: "issue-8"
    category: architecture
    lesson: |
      Prioritize background work by what unblocks the user. Make the whole library searchable first,
      then do speculative thumbnail rendering.
    applied: true

  - id: 9
    date: 2026-10-07
    source: "observation"
    category: testing
    lesson: |
      Deterministic pathological datasets and an independent reviewer found what unit tests did not:
      3 crash-level bugs and 3 High review findings. Budget for both on any file-processing app.
    applied: true

  - id: 10
    date: 2026-10-07
    source: "observation"
    category: tooling
    lesson: |
      When the Windows target std can't be downloaded, `RUSTC_BOOTSTRAP=1 cargo check -Zbuild-std
      --target x86_64-pc-windows-gnu`, with rust-src and mingw-w64, type-checks all Windows-only
      code from Linux.
    applied: true

  - id: 11
    date: 2026-10-07
    source: "observation"
    category: testing
    lesson: |
      A real-app E2E suite (tauri-driver + WebKitWebDriver under Xvfb) catches integration bugs
      mocks cannot, such as the watcher feedback loop and the restore race. Keep it runnable via
      `just e2e`.
    applied: true

  - id: 12
    date: 2026-10-07
    source: "decision"
    category: process
    lesson: |
      Run parallel agents with disjoint file ownership and frozen contracts. Give agents that compile
      the same crate separate git worktrees, so half-written code in one never breaks another's build.
    applied: true

  - id: 13
    date: 2026-10-07
    source: "observation"
    category: tooling
    lesson: |
      Prefer cross-platform Node helpers (tools/*.mjs) over [windows]/[unix] recipe pairs in a
      justfile. Older just versions reject doc comments around attributes, and the logic is easier
      to test.
    applied: true

  - id: 14
    date: 2026-10-07
    source: "decision"
    category: security
    lesson: |
      Updater signing keys are generated by a human, outside the repo. Agents only write the public
      key, and release workflows refuse to run while it is still a placeholder.
    applied: true

  - id: 15
    date: 2026-10-07
    source: "issue-19"
    category: process
    lesson: |
      Run the exact CI gate (`just ci`) locally before handing work off. A one-line edit made after
      the last `cargo fmt` was enough to fail the first CI run.
    applied: true

  - id: 16
    date: 2026-10-07
    source: "observation"
    category: process
    lesson: |
      `git commit -am` stages every modified tracked file. When a file can't be updated on disk
      (here, locked by Windows), the stale working copy gets committed and silently reverts newer
      content. Check `git status` before `-am`.
    applied: false
