name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # Windows is the product target (WebView2, Win32 clipboard, OLE drag).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Same version as rust-toolchain.toml: CI must lint with the clippy the code was verified with.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      # Cargo workspace rooted at the repo: svg-core is a large part of the compile.
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and typecheck (fmt, tsc, clippy -D warnings)
        run: just check

      - name: Test
        run: just test
