[package]
name = "iconarium"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Iconarium desktop application"

[lib]
name = "iconarium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
svg-core = { path = "../crates/svg-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Auto-update: the updater fetches plugins.updater.endpoints (tauri.conf.json) and refuses anything
# not signed by the matching private key. The process plugin provides the relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
blake3.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
notify = "8"
notify-debouncer-full = "0.7"
drag = "2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[target.'cfg(not(windows))'.dependencies]
clipboard-rs = "0.3"
